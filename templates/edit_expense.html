<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Expense</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Edit Expense</h1>

        <form action="/edit/{{ expense[0] }}" method="POST">

            <label>Amount</label>

            <input
                type="number"
                name="amount"
                step="0.01"
                value="{{ expense[1] }}"
                required
            >


            <label>Category</label>

            <select name="category" required>

                <option value="Food"
                    {% if expense[2] == "Food" %}selected{% endif %}>
                    Food
                </option>

                <option value="Travel"
                    {% if expense[2] == "Travel" %}selected{% endif %}>
                    Travel
                </option>

                <option value="Shopping"
                    {% if expense[2] == "Shopping" %}selected{% endif %}>
                    Shopping
                </option>

                <option value="Bills"
                    {% if expense[2] == "Bills" %}selected{% endif %}>
                    Bills
                </option>

                <option value="Other"
                    {% if expense[2] == "Other" %}selected{% endif %}>
                    Other
                </option>

            </select>


            <label>Description</label>

            <input
                type="text"
                name="description"
                value="{{ expense[3] }}"
            >


            <label>Date</label>

            <input
                type="date"
                name="date"
                value="{{ expense[4] }}"
                required
            >


            <button type="submit">
                Update Expense
            </button>

        </form>

        <br>

        <a href="/">Back to Home</a>

    </div>

</body>

</html>
